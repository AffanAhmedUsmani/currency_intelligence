services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/dbdata
    environment:
      - CI_CORS_ORIGINS=["http://localhost:5173","http://localhost:80"]
      - CI_DATABASE_URL=sqlite:////app/dbdata/data.db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
